<title>JobFit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a search-engine front door (one big pill input) over a results column + a sticky side panel for resume & requirements. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --sunken: #eef0f4;
  --ink: #161b26;
  --muted: #5c6577;
  --line: #d9dde5;
  --accent: #2346d6;
  --accent-ink: #ffffff;
  --go: #14804a;   --go-bg: #e3f4ea;
  --maybe: #a5640a; --maybe-bg: #fbf0dc;
  --stop: #c0322b; --stop-bg: #fbe5e3;
  --unk: #5c6577;  --unk-bg: #eceef2;
  --font-display: "Bricolage Grotesque", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10131a; --surface: #181c25; --sunken: #1f2430; --ink: #e8ebf2; --muted: #9aa3b5; --line: #2c3240;
  --accent: #7d95ff; --accent-ink: #0d1020;
  --go: #5fd394; --go-bg: #15301f; --maybe: #f0b65a; --maybe-bg: #33280f; --stop: #ff7d74; --stop-bg: #3a1a18;
  --unk: #9aa3b5; --unk-bg: #232835; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #10131a; --surface: #181c25; --sunken: #1f2430; --ink: #e8ebf2; --muted: #9aa3b5; --line: #2c3240;
  --accent: #7d95ff; --accent-ink: #0d1020;
  --go: #5fd394; --go-bg: #15301f; --maybe: #f0b65a; --maybe-bg: #33280f; --stop: #ff7d74; --stop-bg: #3a1a18;
  --unk: #9aa3b5; --unk-bg: #232835; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- front door ---------- */
.door { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.4rem, 7vw, 3.6rem); letter-spacing: -0.03em; line-height: 1; margin: 0; }
.brand b { color: var(--accent); font-weight: 800; }
.steps { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; color: var(--muted); font-size: 13px; }
.steps span { font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.search { width: 100%; max-width: 760px; display: flex; align-items: center; gap: 8px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 18px rgba(20,30,60,.06); }
.search:focus-within { border-color: var(--accent); }
.search svg { flex: none; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 10px 0; font-size: 16px; }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; text-align: center; max-width: 640px; margin: 0; }

.paste { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 8px; }
.paste summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.notice { border: 1px solid var(--maybe); background: var(--maybe-bg); color: var(--ink); border-radius: var(--radius); padding: 10px 14px; font-size: 14px; }
.notice a { color: var(--accent); word-break: break-all; }
textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 12px 14px; resize: vertical; line-height: 1.5; }
textarea:focus { outline: none; border-color: var(--accent); }

/* ---------- main grid ---------- */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (min-width: 901px) { .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }
.tabs { display: flex; gap: 4px; background: var(--sunken); padding: 4px; border-radius: 999px; }
.tabs button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 6px 8px; cursor: pointer; font-size: 13px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
label.f input, label.f select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; color: var(--ink); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.small-note { font-size: 12px; color: var(--muted); margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }

/* ---------- verdict ---------- */
.verdict { border-radius: 14px; padding: 18px 20px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; border: 1px solid; }
.verdict.APPLY { background: var(--go-bg); border-color: var(--go); }
.verdict.MAYBE { background: var(--maybe-bg); border-color: var(--maybe); }
.verdict.SKIP { background: var(--stop-bg); border-color: var(--stop); }
.verdict h2 { font-family: var(--font-display); font-size: 1.9rem; margin: 0; letter-spacing: -0.02em; line-height: 1.1; }
.verdict.APPLY h2 { color: var(--go); } .verdict.MAYBE h2 { color: var(--maybe); } .verdict.SKIP h2 { color: var(--stop); }
.verdict .who { font-weight: 600; grid-column: 1; }
.verdict .why { grid-column: 1 / -1; color: var(--ink); }
.score { grid-row: 1 / 3; grid-column: 2; text-align: right; }
.score .n { font-family: var(--font-mono); font-size: 2.2rem; font-weight: 500; line-height: 1; }
.score .d { font-size: 12px; color: var(--muted); }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); }

.checks { display: flex; flex-direction: column; gap: 8px; }
.check { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.check summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 12px 14px; }
.check summary::-webkit-details-marker { display: none; }
.pill { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .05em; padding: 3px 8px; border-radius: 6px; min-width: 64px; text-align: center; }
.pill.pass { background: var(--go-bg); color: var(--go); } .pill.fail { background: var(--stop-bg); color: var(--stop); }
.pill.warn { background: var(--maybe-bg); color: var(--maybe); } .pill.unclear { background: var(--unk-bg); color: var(--unk); }
.check .t { font-weight: 600; } .check .s { color: var(--muted); font-size: 14px; }
.ev { padding: 0 14px 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.ev blockquote { margin: 0; padding: 6px 10px; border-left: 3px solid var(--line); background: var(--sunken); border-radius: 0 6px 6px 0; font-size: 13px; overflow-wrap: anywhere; }

.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--sunken); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.cat { font-size: 11px; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
.cat.core_ds { background: var(--go-bg); color: var(--go); } .cat.learnable_domain { background: var(--maybe-bg); color: var(--maybe); }
.cat.sde_out_of_scope { background: var(--stop-bg); color: var(--stop); } .cat.other { background: var(--unk-bg); color: var(--unk); }
h3 { font-family: var(--font-display); font-size: 1.15rem; margin: 6px 0 0; letter-spacing: -0.01em; }
ul.tips { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.thinking { display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
.hist { display: flex; flex-direction: column; }
.hist .item { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.hist .item:last-child { border-bottom: 0; }
.hist .item .w { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
input.plain { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 9px 12px; }
.verify { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.verify a { color: var(--accent); }
.modes { width: 100%; max-width: 360px; }
.multi { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 10px; }
.jobblock { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.jobblock .top { display: flex; gap: 8px; align-items: center; }
.jobblock .top input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; }
.jobblock .num { font-family: var(--font-mono); color: var(--muted); font-size: 12px; flex: none; }
.multibar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
label.f.inline { flex-direction: row; align-items: center; gap: 6px; font-size: 14px; color: var(--ink); }
.rank td.n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.rank tr.rec td:first-child { color: var(--go); font-weight: 600; }
.picks { border: 1px solid var(--go); background: var(--go-bg); border-radius: var(--radius); padding: 12px 14px; }
.picks.none { border-color: var(--stop); background: var(--stop-bg); }
details.job > summary { cursor: pointer; padding: 10px 2px; font-weight: 600; }
details.job > div { display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px; }
</style>

<div class="wrap">
  <header class="door">
    <h1 class="brand">Job<b>Fit</b></h1>
    <div class="steps" aria-label="筛选顺序"><span>1 公民身份</span><span>2 OPT/CPT/H-1B</span><span>3 毕业时间</span><span>4 技术门槛</span></div>
    <div class="tabs modes" role="tablist" aria-label="模式">
      <button role="tab" type="button" id="m-single" aria-selected="true" data-mode="single">单个岗位</button>
      <button role="tab" type="button" id="m-multi" aria-selected="false" data-mode="multi">同公司多岗位对比</button>
    </div>
    <div class="multi" id="multiMode" hidden>
      <p class="hint">同一家公司有多个岗位、但只允许投 1–3 个时用：每个框粘一个完整 JD，按适配度和难度排序，选出最值得投的。</p>
      <input id="multiCompany" class="plain" type="text" placeholder="公司名（可选，用来查 H-1B 记录）" aria-label="公司名">
      <div id="jobBlocks" class="checks"></div>
      <div class="multibar">
        <button class="btn small ghost" id="addJob" type="button">+ 再加一个岗位</button>
        <label class="f inline">最多可投 <select id="maxApply"></select> 个</label>
        <button class="btn" id="compare" type="button">对比这些岗位</button>
      </div>
    </div>
    <form class="search" id="searchForm" role="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="q" type="text" autocomplete="off" placeholder="粘贴职位链接，或直接把整段 JD 粘进来" aria-label="JD 链接或 JD 文本">
      <button class="btn" id="go" type="submit">分析适配度</button>
    </form>
    <div class="paste">
      <div class="notice" id="urlNotice" hidden></div>
      <details id="pasteBox">
        <summary>手动粘贴完整 JD</summary>
        <textarea id="jd" rows="10" placeholder="把整个 JD 复制进来（包括 Qualifications / Benefits / 签证说明部分）"></textarea>
      </details>
      <details id="companyBox">
        <summary>公司名（可选，用来查 H-1B 记录；不填会自动识别）</summary>
        <input id="company" class="plain" type="text" placeholder="例如 Robinhood" aria-label="公司名">
      </details>
    </div>
  </header>

  <div class="grid">
    <main class="panel" id="results" aria-live="polite"></main>

    <aside class="panel side">
      <div class="tabs" role="tablist">
        <button role="tab" id="t-resume" aria-selected="true" data-tab="resume">简历</button>
        <button role="tab" id="t-req" aria-selected="false" data-tab="req">必备条件</button>
        <button role="tab" id="t-cfg" aria-selected="false" data-tab="cfg">保存 / 历史</button>
      </div>

      <section data-pane="resume" class="checks">
        <label class="f">简历文本（从 PDF/Word 全选复制粘贴即可）
          <textarea id="resume" rows="14" placeholder="Education… Experience… Skills: Python, SQL, …"></textarea>
        </label>
        <label class="f">或上传 .txt / .md 文件
          <input id="resumeFile" type="file" accept=".txt,.md,text/plain">
        </label>
        <p class="small-note" id="resumeCount">还没有简历</p>
      </section>

      <section data-pane="req" class="checks" hidden>
        <label class="f">签证身份 <input id="visa" type="text"></label>
        <div class="row2">
          <label class="f">毕业年份 <select id="gy"></select></label>
          <label class="f">毕业月份 <select id="gm"></select></label>
        </div>
        <p class="small-note">"2027 Winter" 默认按 2027 年 12 月；如果指 2027 年初，改成 1–3 月。</p>
        <label class="switch"><span>JD 写明不 sponsor → 直接放弃</span><input id="rejectNoSp" type="checkbox"></label>
        <label class="switch"><span>JD 没提签证时，看公司有没有 H-1B 记录</span><input id="checkH1b" type="checkbox"></label>
        <label class="switch"><span>用 Claude 深度分析技能（用你自己的 Claude 额度）</span><input id="useClaude" type="checkbox"></label>
        <label class="f">投递阈值 <span class="mono" id="thrVal"></span>
          <input id="thr" type="range" min="30" max="90" step="5">
        </label>
        <label class="f">其他必备条件（每行一条）
          <textarea id="extra" rows="4" placeholder="必须是 internship / co-op&#10;地点在 NY 或 Remote&#10;不接受 PhD only"></textarea>
        </label>
      </section>

      <section data-pane="cfg" class="checks" hidden>
        <p class="small-note">简历和设置只存在你自己的浏览器里，别人打开这个链接看不到。换电脑或清缓存前，先导出一份。</p>
        <div class="btnrow">
          <button class="btn small" id="exportBtn" type="button">导出配置</button>
          <button class="btn small ghost" id="copyBtn" type="button">复制配置文本</button>
        </div>
        <label class="f">导入配置（.json）<input id="importFile" type="file" accept=".json,application/json"></label>
        <p class="small-note" id="cfgMsg"></p>
        <h3>历史记录</h3>
        <div class="hist" id="hist"><p class="small-note">分析过的岗位会出现在这里。</p></div>
        <div class="btnrow"><button class="btn small ghost" id="exportHist" type="button">导出历史 CSV</button></div>
      </section>
    </aside>
  </div>
</div>

<script>
/* ================= storage (this viewer's browser only) ================= */
const DEFAULTS = { resume: "", visa_status: "F-1 (CPT now, OPT / STEM OPT after graduation)", grad_year: 2027, grad_month: 12,
  reject_no_sponsorship: true, check_h1b_history: true, use_llm: true, apply_threshold: 65, extra_requirements: "" };
const store = {
  get(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let profile = normalize(store.get("jobfit.profile.v1", {}));
let history = store.get("jobfit.history.v1", []);
function normalize(p) { const o = {}; for (const k in DEFAULTS) o[k] = (p && p[k] !== undefined) ? p[k] : DEFAULTS[k]; return o; }

/* ================= rules (ported from jobfit/rules.py) ================= */
const PASS = "pass", WARN = "warn", FAIL = "fail", UNCLEAR = "unclear";
const US = String.raw`(?:u\.?\s?s\.?(?:a\.?)?|united\s+states)`;
const R = (s) => new RegExp(s);

function splitSentences(text) {
  return text.split(/(?<=[a-z0-9)][.!?])\s+|(?<=;)\s+|\n+|•|·/).map(s => s.trim()).filter(s => s.length > 3);
}
function find(patterns, sentences, skipNegated) {
  return sentences.filter(s => {
    const low = s.toLowerCase();
    if (skipNegated && /\b(?:not|no|never)\s+(?:be\s+)?(?:required|necessary|needed)/.test(low)) return false;
    return patterns.some(p => p.test(low));
  });
}

const CITIZENSHIP = [
  String.raw`\b${US}\s+citizen(?:ship)?\s+(?:is\s+|are\s+)?(?:required|mandatory|needed|a\s+must)`,
  String.raw`\bmust\s+(?:be|hold|have|possess)\s+(?:a\s+)?${US}\s+citizen`,
  String.raw`\brequires?\s+${US}\s+citizenship`,
  String.raw`\b(?:only\s+${US}\s+citizens|${US}\s+citizens?\s+only)`,
  String.raw`\b${US}\s+citizens?\s+(?:or|and/or|/)\s+(?:lawful\s+)?(?:permanent\s+residents?|green\s*card)`,
  String.raw`\bcitizenship\s+(?:is\s+)?required`,
  String.raw`\bmust\s+be\s+(?:a\s+)?(?:citizen|permanent\s+resident|green\s*card\s+holder)`,
  String.raw`\bpermanent\s+(?:\w+\s+){0,2}work\s+authori[sz]ation`,
  String.raw`\bauthori[sz]ed\s+to\s+work\b.{0,60}\bpermanent(?:ly|\s+basis)?\b`,
  String.raw`\b(?:green\s*card|permanent\s+residents?)\s+(?:holders?\s+)?(?:only|required)`,
  String.raw`\b(?:active|current|existing|obtain|maintain|eligib\w*\s+(?:to|for))\s+(?:an?\s+)?(?:\w+\s+){0,2}security\s+clearance`,
  String.raw`\bsecurity\s+clearance\s+(?:is\s+)?required`,
  String.raw`\b(?:ts/sci|top\s+secret(?:\s+clearance)?|secret\s+clearance)\b`,
  String.raw`\bitar\b`,
  String.raw`\b${US}\s+persons?\b.{0,40}\b(?:itar|ear|export|22\s*cfr|required)`,
  String.raw`\bexport\s+control\w*\b.{0,80}\b(?:citizen|u\.?s\.?\s+person)`,
].map(R);

const NO_SPONSOR = [
  String.raw`\b(?:unable|not\s+able|cannot|can't|can\s+not|will\s+not|won't|does\s+not|do\s+not|doesn't|don't|not\s+in\s+a\s+position)\s+(?:to\s+)?(?:\w+\s+){0,3}sponsor`,
  String.raw`\bno\s+(?:\w+\s+)?(?:visa\s+|immigration\s+)?sponsorship`,
  String.raw`\bsponsorship\s+(?:is\s+|will\s+)?(?:not|n't)\b`,
  String.raw`\bsponsorship\s+(?:is\s+)?unavailable`,
  String.raw`\bwithout\s+(?:the\s+)?(?:need\s+for\s+|requiring\s+|requirement\s+of\s+)?(?:current\s+or\s+future\s+|future\s+)?(?:\w+\s+){0,2}sponsorship`,
  String.raw`\bnot\s+(?:be\s+)?eligible\s+for\s+(?:\w+\s+)?sponsorship`,

function checkVisa(jd, rejectNoSp) {
  const name = "2. 签证 (OPT / CPT / H-1B)";

  if (no.length) return [step(name, WARN, "信号矛盾：有 sponsorship 限制，但也提到了 OPT/CPT/H-1B，需要人工细看", [...no, ...h1b, ...opt].slice(0, 5)), "mixed"];

const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
const SEASONS = { spring: 5, summer: 8, fall: 12, autumn: 12, winter: 12 };
const DATE_RE = /\b(?:(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?,?\s+|(spring|summer|fall|autumn|winter)\s+)?(?:of\s+)?(20[2-3]\d)\b/g;
const GRAD_CONTEXT = /graduat|class\s+of|degree\s+(?:completion|conferral)|complet\w*\s+(?:your|their|a|the)?\s*degree|expected\s+(?:to\s+)?(?:graduat|complet)|enrolled|pursuing|returning\s+to\s+school|remaining\s+after/;

function parseDates(s) {
  return [...s.matchAll(DATE_RE)].map(m => {
    const y = +m[3];
    if (m[1]) return [y, MONTHS[m[1].slice(0, 3)], true];
    if (m[2]) return [y, SEASONS[m[2]], true];
    return [y, 0, false];
  });
}
function checkGraduation(jd, gy, gm) {
  const name = "3. 毕业时间";
  const me = gy * 12 + gm;
  const good = [], bad = [], hints = [];
  const key = (d, upper) => d[0] * 12 + (d[2] ? d[1] : (upper ? 12 : 1));
  for (const s of splitSentences(jd)) {
    const low = s.toLowerCase();
    if (!GRAD_CONTEXT.test(low)) continue;
    const dates = parseDates(low);
    if (!dates.length) {
      if (/returning\s+to\s+school|remaining\s+after|at\s+least\s+one\s+(?:more\s+)?(?:semester|quarter|term)/.test(low)) hints.push(s);
      continue;
    }
    let ok;
    if (dates.length >= 2 && /between|from|\bto\b|through|-|–/.test(low)) ok = key(dates[0]) <= me && me <= key(dates[1], true);
    else if (/\b(?:by|before|no\s+later\s+than|prior\s+to)\b/.test(low)) ok = me <= key(dates[0], true);
    else if (/\b(?:after|or\s+later|no\s+earlier\s+than)\b/.test(low)) ok = me >= key(dates[0]);
    else if (/\bclass\s+of\b/.test(low) || !dates[0][2]) ok = dates[0][0] === gy;
    else ok = Math.abs(dates[0][0] * 12 + dates[0][1] - me) <= 3;
    (ok ? good : bad).push(s);
  }
  if (bad.length && !good.length) return step(name, FAIL, "JD 的毕业时间范围不包含你的毕业时间", bad.slice(0, 4));
  if (bad.length) return step(name, WARN, "JD 提到多个毕业时间，部分不符", [...bad, ...good].slice(0, 4));
  if (good.length) return step(name, PASS, "你的毕业时间在 JD 要求的范围内", good.slice(0, 4));
  if (hints.length) return step(name, PASS, "JD 要求实习后仍在读 — 符合你的情况", hints.slice(0, 3));
  return step(name, UNCLEAR, "JD 没有明确的毕业时间要求");
}

function checkSkillsKeywords(jd, resume) {
  const name = "4. 技能匹配（关键词）";
  const jdDs = hits(DS, jd), have = new Set(hits(DS, resume));
  const sdeHave = new Set(hits(SDE, resume)), sdeMissing = hits(SDE, jd).filter(s => !sdeHave.has(s));
  const domains = hits(DOMAINS, jd);
  const matched = jdDs.filter(s => have.has(s)), missing = jdDs.filter(s => !have.has(s));
  let score = jdDs.length ? Math.round(100 * matched.length / jdDs.length) : 50;
  score = Math.max(0, score - 10 * sdeMissing.length);
  // Industry words are shown but never scored; the job title isn't used at all.
  const ev = [`岗位的数据技术栈：${jdDs.join(", ") || "—"}`, `你有的：${matched.join(", ") || "—"}`, `你缺的：${missing.join(", ") || "—"}`,

function estimateDifficulty(jd, title = "") {
  const low = jd.toLowerCase(), head = (title + " " + jd.slice(0, 300)).toLowerCase();
  let score = 35; const why = [];
  const years = splitSentences(low).filter(s => s.includes("experience"))
    .flatMap(s => [...s.matchAll(/(\d{1,2})\s*\+?\s*(?:-\s*\d{1,2}\s*)?(?:years?|yrs?)\b/g)].map(m => +m[1])).filter(y => y <= 15);
  if (years.length) { const y = Math.max(...years); score += 8 * y; why.push(`要求 ${y}+ 年经验`); }
  if (/ph\.?\s?d[^.]{0,60}\b(?:required|must)|\b(?:required|must)[^.]{0,60}ph\.?\s?d/.test(low)) { score += 20; why.push("要求 PhD"); }
  else if (/\bph\.?\s?d\b/.test(low)) { score += 8; why.push("PhD 优先"); }
  if (/\b(?:senior|sr\.?|staff|lead|principal|manager)\b/.test(head)) { score += 15; why.push("高级职位"); }
  if (/\b(?:intern(?:ship)?|co-?op|new\s+grad|entry[\s-]level|early\s+career)\b/.test(head)) { score -= 10; why.push("实习 / 入门级"); }
  return [Math.max(0, Math.min(100, score)), why.join("；") || "无明显门槛信号"];
}

const LABELS = { 1: "需要公民身份", 2: "不提供签证支持 / 不接受 OPT·CPT", 3: "毕业时间不符", 4: "技术门槛不符" };
function decide(steps, score, p) {
  for (let i = 0; i < steps.length; i++) if (steps[i].status === FAIL) return { decision: "SKIP", score, reason: `Step ${i + 1}：${LABELS[i + 1]} — ${steps[i].summary}`, steps };
  const t = p.apply_threshold;
  if (score >= t && !steps.some(s => s.status === WARN)) return { decision: "APPLY", score, reason: "通过全部筛选，建议投递", steps };
  if (score >= t - 15) return { decision: "MAYBE", score, reason: "基本符合，但有需要人工确认的地方", steps };
  return { decision: "SKIP", score, reason: `匹配度 ${score} 低于阈值 ${t}`, steps };
}

  const v = await screenCore(jd, p, ui, company);
  const rep = v.report;
  if (rep && Number.isFinite(+rep.difficulty)) { v.difficulty = Math.max(0, Math.min(100, Math.round(+rep.difficulty))); v.difficulty_reason = String(rep.difficulty_reason || ""); }
  else [v.difficulty, v.difficulty_reason] = estimateDifficulty(jd, v.title || title);
  return v;
}

// Fit counts more than difficulty: a strong match at a hard team still beats a weak match at an easy one.
const DIFFICULTY_WEIGHT = 0.4;
const priority = (v) => (v.score || 0) - DIFFICULTY_WEIGHT * (v.difficulty || 0);
function rankJobs(verdicts, maxApply) {
  const order = { APPLY: 0, MAYBE: 1, SKIP: 2 };
  const ranked = [...verdicts].sort((a, b) => (a.decision === "SKIP") - (b.decision === "SKIP") || priority(b) - priority(a) || order[a.decision] - order[b.decision]);
  let picked = 0;
  return ranked.map(v => { const rec = v.decision !== "SKIP" && picked < maxApply; if (rec) picked++; return [v, rec]; });
}

async function screenCore(jd, p, ui, company = "") {
  const steps = [];
  const s1 = checkCitizenship(jd); steps.push(s1);
  if (s1.status === FAIL) return { decision: "SKIP", score: null, reason: "需要美国公民 / 绿卡 / 安全许可 — 直接放弃，后面不再检查", steps };
  const [s2, visaLabel] = checkVisa(jd, p.reject_no_sponsorship);
  const s3 = checkGraduation(jd, p.grad_year, p.grad_month);
  steps.push(s2, s3);
  const lookup = (rep) => p.check_h1b_history ? sponsorInfo(company || (rep && rep.company) || guessCompany(jd), rep) : null;
  let info = lookup(null);
  steps[1] = applySponsorHistory(s2, visaLabel, info);

  if (!p.resume.trim()) {
    for (let i = 0; i < steps.length; i++) if (steps[i].status === FAIL) return { decision: "SKIP", score: null, reason: `Step ${i + 1} 未通过 — ${steps[i].summary}`, steps, sponsor: info };
    return { decision: "MAYBE", score: null, reason: "前三步通过；在右侧填入简历后才能做技能匹配", steps, sponsor: info };
  }

  let note = "";
  if (p.use_llm && sample) {
    ui.thinking();
    try {
      const rep = await sample.json(claudePrompt(jd, p), { signal: ui.signal, effort: "medium" });
      const v = mergeClaude(rep, steps, s2, s3, p);
      if (v.steps.length > 1 && v.steps[0].status !== FAIL) {
        info = lookup(rep);
        const label = v.steps[1].status === FAIL ? "no_sponsorship" : String(rep.sponsorship || "none_mentioned");
        v.steps[1] = applySponsorHistory(v.steps[1], label, info);
        Object.assign(v, decide(v.steps, v.score ?? 0, p), { report: rep, title: rep.job_title, company: rep.company, sponsor: info });
        const extra = Array.isArray(rep.other_must_have_issues) ? rep.other_must_have_issues.map(String) : [];
        if (extra.length && v.decision === "APPLY") { v.decision = "MAYBE"; v.reason = "不满足你的额外必备条件：" + extra.join("；"); }
      }
      return v;
    } catch (e) {
      if (e && e.code === "cancelled") note = "已停止 Claude 分析，改用关键词匹配。";
      else if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) note = "没有允许这个页面使用 Claude，已改用关键词匹配。";
      else if (e && e.code === "rate_limited") note = "Claude 额度暂时用完或请求太频繁，已改用关键词匹配，稍后再试。";
      else note = "Claude 分析没成功，已改用关键词匹配。可以再点一次分析。";
    }
  } else if (p.use_llm && !sample) {
    note = "当前打开方式无法调用 Claude（需在 claude.ai 登录后打开），已改用关键词匹配。";
  }
  const [s4, score] = checkSkillsKeywords(jd, p.resume);
  steps.push(s4);
  const v = decide(steps, score, p);
  v.note = note; v.sponsor = info;
  return v;
}

function mergeClaude(rep, steps, s2, s3, p) {
  const arr = (x) => Array.isArray(x) ? x.map(String) : [];
  if (rep.citizenship_blocked === true) {
    steps[0] = step(steps[0].step, FAIL, "Claude 发现了公民身份 / clearance 要求", [String(rep.citizenship_evidence || "")]);
    return { decision: "SKIP", score: null, reason: "需要美国公民 / 绿卡 / 安全许可 — 直接放弃", steps, report: rep, title: rep.job_title, company: rep.company };
  }
  const spMap = { h1b: PASS, opt_cpt: PASS, none_mentioned: UNCLEAR, no_sponsorship: p.reject_no_sponsorship ? FAIL : WARN };
  let vs = spMap[rep.sponsorship] || UNCLEAR;
  if (s2.status === FAIL) vs = FAIL;
  const spLabel = { h1b: "提供 H-1B", opt_cpt: "接受 OPT/CPT", none_mentioned: "未提及签证", no_sponsorship: "不提供 sponsorship" }[rep.sponsorship] || "未知";
  steps[1] = step(s2.step, vs, `Claude：${spLabel}。${s2.summary}`, [rep.sponsorship_evidence, ...s2.evidence].filter(Boolean).map(String));
  let gs = { yes: PASS, no: FAIL, unclear: UNCLEAR }[rep.graduation_fit] || UNCLEAR;
  if (s3.status === FAIL && gs !== PASS) gs = FAIL;
  steps[2] = step(s3.step, gs, String(rep.graduation_reasoning || s3.summary), s3.evidence);
  const score = Math.max(0, Math.min(100, parseInt(rep.fit_score, 10) || 0));
  // Step 4 is about the technical bar; industry knowledge never counts against the job.
  const blockers = arr(rep.sde_blockers), barKey = ["matches", "stretch", "above"].includes(rep.technical_bar) ? rep.technical_bar : "stretch";
  const bar = { matches: "技术门槛一致", stretch: "技术门槛略高", above: "技术门槛超出" }[barKey], barWhy = String(rep.technical_bar_reason || "");
  let s4s, s4sum;
  if (blockers.length) { s4s = FAIL; s4sum = `超纲 SDE 技能：${blockers.join(", ")}`; }
  else if (barKey === "above") { s4s = FAIL; s4sum = `${bar}：${barWhy}`; }
  else { s4s = score >= p.apply_threshold && barKey === "matches" ? PASS : WARN; s4sum = `${bar}，匹配度 ${score}/100`; }
  const stack = arr(rep.tech_stack).length ? [`技术栈：${arr(rep.tech_stack).join(", ")}`] : [];
  steps.push(step("4. 技能与经历（Claude）", s4s, s4sum, [...stack, barWhy, ...arr(rep.other_must_have_issues)].filter(Boolean)));
  const v = decide(steps, score, p);
  v.report = rep; v.title = rep.job_title; v.company = rep.company;
  const extra = arr(rep.other_must_have_issues);
  if (extra.length && v.decision === "APPLY") { v.decision = "MAYBE"; v.reason = "不满足你的额外必备条件：" + extra.join("；"); }
  return v;
}

const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {

  for (const k in (attrs || {})) { if (k === "class") el.className = attrs[k]; else if (k === "text") el.textContent = attrs[k]; else el.setAttribute(k, attrs[k]); }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}

        h("td", { text: k.required ? "必需" : "加分" }),
        h("td", { text: k.have ? "✓ 有" : "✗ 无" }),
        h("td", { text: String(k.note || "") })))))));
  }
  if (rep && rep.summary) box.append(h("h3", { text: "总结" }), h("p", { text: String(rep.summary), style: "margin:0" }));

      h("td", null, h("span", { class: `pill ${v.decision === "APPLY" ? "pass" : v.decision === "SKIP" ? "fail" : "warn"}`, text: v.decision })),
      h("td", { class: "n", text: v.score ?? "—" }),
      h("td", { class: "n", text: v.difficulty ?? "—" }),
      h("td", { class: "n", text: v.decision === "SKIP" ? "—" : Math.round(priority(v)) })))))));
  box.append(h("p", { class: "small-note", text: `优先级 = 适配度 − ${DIFFICULTY_WEIGHT} × 难度。没通过硬性筛选的岗位排在最后，不会被推荐。` }));
  ranked.forEach(([v, rec], i) => {
    const inner = h("div");
    renderResult(v, { box: inner });
    box.append(h("details", { class: "job" }, h("summary", { text: `${rec ? "★ " : ""}#${i + 1} ${VERDICT[v.decision]} · ${v.title}` }), inner));
  });
}
